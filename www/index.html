<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>野人量化</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">野</div>
      <div class="brand-name">野人量化</div>
    </div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="btnTheme" aria-label="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 13.5A8.5 8.5 0 019.5 3a8.5 8.5 0 1010.5 10.5z"/>
      </svg>
    </button>
    <button class="icon-btn" id="btnRefresh" aria-label="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 4v5h-5"/>
      </svg>
    </button>
  </header>
  <main id="view"></main>
</div>

<script src="js/util.js"></script>
<script src="js/net.js"></script>
<script src="js/sources.js"></script>
<script src="js/engine.js"></script>
<script src="js/portfolio.js"></script>
<script src="js/kline.js"></script>
<script src="js/ui.js"></script>
<script src="js/update.js"></script>
<script src="js/app.js"></script>
<script>
/* 顶栏主题按钮：亮/暗直接切换；长按恢复「跟随系统」 */
(function () {
  var btn = document.getElementById('btnTheme');
  var timer = null, longPressed = false;
  function paint() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.innerHTML = dark
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8.5 8.5 0 019.5 3a8.5 8.5 0 1010.5 10.5z"/></svg>';
  }
  btn.addEventListener('touchstart', function () {
    longPressed = false;
    timer = setTimeout(function () {
      longPressed = true;
      YB.util.Theme.set('auto');
      YB.util.Theme.apply('auto');
      paint();
      YB.ui.toast('已切换为跟随系统');
    }, 650);
  }, { passive: true });
  btn.addEventListener('touchend', function () { clearTimeout(timer); });
  btn.addEventListener('click', function () {
    if (longPressed) { longPressed = false; return; }
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    YB.util.Theme.set(dark ? 'light' : 'dark');
    paint();
  });
  document.addEventListener('yb:theme', paint);
  paint();
})();
</script>
</body>
</html>
